<!doctype html><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Byteview · Luau workbench</title><style>*{box-sizing:border-box}body{background:#10151b;color:#ecf4f5;font:16px system-ui;margin:7vh auto;padding:0 5%;max-width:1000px}small,label{color:#98c6bc}h1{font-size:clamp(38px,7vw,74px);letter-spacing:-.06em;margin:12px 0}section{background:#1a232b;border:1px solid #35434d;padding:22px;border-radius:16px;margin:20px 0}textarea,pre{width:100%;background:#10171d;color:#c2e3de;padding:16px;border:0;border-radius:8px;overflow:auto}button,select{padding:10px 16px;border:0;border-radius:6px;margin:8px 4px 0 0}button{background:#9ce9c7;cursor:pointer}label{display:block;margin:10px 0}</style><small>BYTEVIEW　/　LUAU TOOLS</small><h1>Bytecode workbench.</h1><p>Inspect compiled Luau as source or disassembly.</p><section><label for=b>01　/　INPUT · BASE64</label><textarea id=b rows=4 placeholder='Paste compiled bytecode as base64'></textarea><input type=file id=f><button id=s>Load sample</button><label><input type=checkbox id=remote> Send non-sample bytecode to LunaUX for processing</label><select id=m><option>decompile</option><option>disassemble</option></select><button id=run>Run →</button></section><section><small id=status>02　/　OUTPUT</small><pre id=o>Waiting for input.</pre></section><script>s.onclick=()=>b.value={{sample|tojson}};f.onchange=async()=>{let file=f.files[0];if(!file)return;if(file.size>1048576){o.textContent='Choose a file under 1 MiB.';return}let r=new FileReader;r.onload=()=>b.value=r.result.split(',')[1];r.readAsDataURL(file)};run.onclick=async()=>{run.disabled=true;try{statusLine('Processing…');let r=await fetch('/api/'+m.value,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bytecode:b.value.trim(),allowRemote:remote.checked})});o.textContent=await r.text();statusLine(r.headers.get('X-Result-Source')||'Request failed')}catch{statusLine('Connection failed')}finally{run.disabled=false}};function statusLine(t){document.getElementById('status').textContent='02　/　'+t}</script>
